INHERIT: mkdocs.base.yml

docs_dir: docs/en
site_dir: site/en
site_url: !ENV [DOCS_SITE_URL_EN, "http://localhost:8080/en/"]

theme:
  language: en

plugins:
  - search:
      lang:
        - en
        - ru

nav:
  - General:
      - General information, launch and licensing: readme.md
      - First steps in FACEPLATE Studio: Project_strucure/FACEPLATE-start.md
      - Deploying in a Docker container: quick_start/deploy as docker.md
  - Access:
      - Users: access/users.md
      - Roles and access rights: access/roles.md
  - Data acquisition:
      - PLC connections:
          - Overview: data_collection/plc_connections/general_en.md
          - Modbus TCP/RTU: data_collection/plc_connections/plc_modbus_connection_en.md
          - OPC UA client: data_collection/plc_connections/old_plc_opcua_client_connection_en.md
          - OPC UA server: data_collection/plc_connections/old_plc_opcua_server_connection_en.md
          - OPC DA (Classic): data_collection/plc_connections/plc_opcda_connection_en.md
          - Siemens S7 (ISO-on-TCP): data_collection/plc_connections/old_plc_s7_connection_en.md
          - EtherNet/IP: data_collection/plc_connections/plc_ethernet_ip_connection_en.md
          - IEC 60870-5-101 client: data_collection/plc_connections/plc_iec101_client_connection_en.md
          - IEC 60870-5-101 server: data_collection/plc_connections/plc_iec101_server_connection_en.md
          - IEC 60870-5-104 client: data_collection/plc_connections/plc_iec104_client_connection_en.md
          - IEC 60870-5-104 server: data_collection/plc_connections/plc_iec104_server_connection_en.md
          - M-Bus (Meter-Bus): data_collection/plc_connections/plc_mbus_connection_en.md
          - SNMP: data_collection/plc_connections/plc_snmp_connection_en.md
          - Transformation feature: data_collection/plc_connections/transformation_en.md
      - IoT connections:
          - Overview: data_collection/IoT/IoT.md
          - HTTP: data_collection/IoT/http.md
          - MQTT: data_collection/IoT/mqtt.md
          - WebSocket: data_collection/IoT/websocket.md
          - Sources: data_collection/IoT/sources.md
          - Actions: data_collection/IoT/actions.md
  - Data storage:
      - Storage: data_storage/storage/Storage_en.md
      - Archives: data_storage/archives/archives_en.md
      - Trends: data_storage/archives/trends_en.md
      - Aggregates: data_storage/archives/aggregates_en.md
      - Historian server: data_storage/historian/historian_server_en.md
  - Operator tools:
      - Messages and alarms: alarm/alarm_en.md
      - Dispatcher advisor: dsf/dsf_en.md
  - Project objects:
      - Primitives: primitives/Primitives.md
      - Prototypes: prototypes/prototypes.md
      - Catalogs: catalogs/catalogs.md
      - Localization: localization/localization.md
  - Screens:
      - Screen editor: mnemo/editor.md
      - Graphic elements: mnemo/graphics.md
      - Buttons and value input: mnemo/controls.md
      - Selection from lists: mnemo/lists.md
  - Project logic:
      - Calculations: calculation/calculation.md
      - User scripts: user_script/user_script.md
      - Library modules: library_modules/library_modules.md
      - JS libraries: js_library/js_library.md
  - Integrations:
      - Microsoft Power BI: PowerBI_en/PowerBi_FP_en.md
      - REST API interface: quick_start/connectivity/rest api/rest api.md
      - OPC UA client (quick start): quick_start/connectivity/opc_ua/opc_ua_client.md
      - Power BI (quick start): quick_start/connectivity/powerbi/powerbi_en.md
      - Loading data into InfluxDB: quick_start/connectivity/influxdb/influxdb_en.md
      - Powerfactory Service: powerfactory_service/powerfactory_service.md
  - Prototype templates:
      - InfluxDB integration template: quick_start/prptotypes/influxdb/influxdb_en.md
      - Pump template: quick_start/prptotypes/pump/pump_en.md
      - Sensor template: quick_start/prptotypes/sensor/sensor_en.md
  - Machine learning:
      - Forecasting models: machine_learning/forecasting_models_en.md
      - Project export: machine_learning/project_export_en.md
  - Administration:
      - Resource redundancy: administration/Redundancy/Redundancy_en.md
      - Replication: administration/replica/replica_en.md
      - Git module: administration/git/git_en.md
      - Diagnostics of Runtime objects: administration/diagnostics/diagnostics.md

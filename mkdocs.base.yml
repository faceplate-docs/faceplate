# Shared MkDocs settings for both language builds.
# Language-specific files (mkdocs.en.yml, mkdocs.ru.yml) inherit from this one
# and set docs_dir, site_dir, language and nav.

site_name: FACEPLATE Documentation
site_author: Faceplate
repo_url: https://github.com/faceplate-docs/faceplate
edit_uri: edit/dev/docs/
copyright: "&copy; Faceplate"

theme:
  name: material
  # Brand assets (logo, favicon, stylesheet) live in brand/assets and are
  # copied into every build through custom_dir.
  custom_dir: brand
  logo: assets/faceplate-logo.png
  favicon: assets/favicon.png
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  # Colours are defined in brand/assets/brand.css (FACEPLATE red #D71921).
  # Dark is the default, matching faceplate.io; light is available via the
  # toggle in the header.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

extra_css:
  - assets/brand.css

# Language switcher shown in the header. Links are relative to the language
# site root, so they work both at "/" and under a sub-path such as
# "/faceplate/" on GitHub Pages.
extra:
  alternate:
    - name: English
      link: ../en/
      lang: en
    - name: Русский
      link: ../ru/
      lang: ru

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# Files inside docs_dir that must not be published.
exclude_docs: |
  .DS_Store
  *.docx
  ~$*

validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn

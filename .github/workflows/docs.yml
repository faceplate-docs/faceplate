# Build the documentation site on every push and pull request.
# On pushes to dev, publish it to GitHub Pages.
#
# One-time setup in the repository: Settings -> Pages -> Source: "GitHub Actions".
# The site is then served at https://<owner>.github.io/<repo>/ with the
# English docs under /en/ and the Russian docs under /ru/.

name: docs

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MkDocs
        run: pip install -r requirements.txt

      - name: Check internal links
        # Reports broken relative links in docs/. Informational until the
        # existing broken links on dev are fixed; then remove continue-on-error.
        run: python3 tools/check_links.py
        continue-on-error: true

      - name: Build site
        env:
          DOCS_SITE_URL_EN: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/en/
          DOCS_SITE_URL_RU: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ru/
        run: tools/build_site.sh

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
